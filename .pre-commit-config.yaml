repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # .taskmaster/ é gerado pelo task-master; não reformatar
      - id: trailing-whitespace
        exclude: ^\.taskmaster/
      - id: end-of-file-fixer
        exclude: ^\.taskmaster/
      - id: check-yaml
      - id: check-toml
      # uv.lock e o notebook de análise (versionado com saídas, para revisão
      # no GitHub) precisam ser versionados mesmo passando de 500 KB
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: ^(uv\.lock|notebooks/analise_dengue_sp\.ipynb)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: block-main
        name: Block direct commits to main/master
        entry: bash -c 'branch=$(git symbolic-ref --short HEAD); if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then echo "❌ Commits diretos na $branch bloqueados. Crie uma feature branch com git checkout -b feature/<nome>"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
      # mypy roda no ambiente do projeto (uv) para enxergar as dependências e os stubs
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # cobertura mínima (80%) vem de [tool.coverage.report] fail_under no pyproject
      - id: pytest
        name: Run tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
