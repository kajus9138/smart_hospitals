[project]
name = "smart-hospitals"
version = "0.1.0"
description = "Dashboard e MCP server com indicadores de dengue (InfoDengue) para São Paulo capital"
readme = "README.md"
authors = [
    { name = "Kaique", email = "ksilva@ipt.br" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--cov=smart_hospitals --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
source = ["smart_hospitals", "scripts"]

[tool.coverage.report]
fail_under = 80
